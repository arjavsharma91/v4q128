name: v4q128 Benchmarks (Manual)

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Throughput Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download nanobench.h
        run: |
          mkdir -p benchmarks
          curl -sSL -o benchmarks/nanobench.h https://raw.githubusercontent.com/martinus/nanobench/v4.3.11/src/include/nanobench.h

      - name: Compile Benchmark
        run: |
          g++ -O3 -mavx2 -std=c++17 -Iinclude -Ibenchmarks benchmarks/benchmark_mul.cpp -o bench_mul

      - name: Execute Benchmark
        run: ./bench_mul
