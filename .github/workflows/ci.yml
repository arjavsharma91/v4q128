name: v4q128 CI

on:
  push:
    branches: [ "**" ] # Matches every branch name, including nested ones like feature/login
  pull_request:
    branches: [ "main", "master" ] # Keeps PR checks restricted to your core branches

jobs:
  test-multiplication:
    name: Build & Stress Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [g++, clang++]
        build_type: [Release]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build Test Executable
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Edge-Case & Stress Tests
        run: ctest --test-dir build --output-on-failure
